name: CLA

# Blocks a pull request until its author has signed the Individual Contributor
# License Agreement (ICLA.md). The signature is a comment on the pull request;
# the action stores it in signatures/version1/cla.json on the cla-signatures
# branch of this repository, so no external service is involved. The file
# lives on its own branch because the action pushes to it directly and main
# accepts changes only through pull requests.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/PayGlue/PayGlue-OS/blob/main/ICLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: Nuenni,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read the
            [Individual Contributor License Agreement](https://github.com/PayGlue/PayGlue-OS/blob/main/ICLA.md)
            and sign it by posting the comment below. You keep the copyright in
            your contribution, and every published version of PayGlue-OS still
            turns into Apache 2.0 after four years.
          custom-allsigned-prcomment: >
            Thank you for signing the CLA. We will review your pull request
            shortly. You only need to sign once, so later pull requests go
            straight to review.

  thanks:
    name: Thank the contributor
    # Runs once, when a pull request from someone outside the team is merged.
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'Nuenni' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Merged, thank you @$AUTHOR! Your change ships with the next PayGlue-OS release. If you would like to run PayGlue on our hosted infrastructure, write to team@payglue.io, contributors get a goodie."
